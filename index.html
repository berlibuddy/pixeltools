<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelTools — PDF, Immagini e ZIP nel browser</title>
  <meta name="description" content="Strumenti per PDF, immagini e archivi ZIP che funzionano al 100% nel tuo browser. Nessun file viene caricato su un server.">

  <!-- Font: VT323 (pixel, solo logo e titoli) + Space Grotesk (testi) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles/style.css">

  <!-- Librerie via CDN (le altre arrivano da npm, dentro i tool) -->
  <!-- pdf.js: SOLO per mostrare l'anteprima delle pagine nel tool Firma → pdfjsLib -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <!-- La nostra app (sempre per ultima) -->
  <script type="module" src="src/main.js"></script>
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo" aria-label="PixelTools, torna alla dashboard">
        PIXEL<span class="logo-accent">TOOLS</span><span class="logo-cursor" aria-hidden="true"></span>
      </a>
      <span class="badge">🔒 100% nel browser · zero server</span>
    </div>
  </header>

  <main class="container">

    <!-- Avviso se le librerie CDN non si caricano (es. offline) -->
    <div id="lib-warning" class="lib-warning" role="alert" hidden></div>

    <!-- ================= DASHBOARD ================= -->
    <section id="dashboard" aria-labelledby="dash-title">
      <div class="hero">
        <h1 id="dash-title">Cosa vuoi fare oggi?</h1>
        <p>I tuoi file non lasciano mai il computer: tutto viene elaborato qui, nella pagina.</p>
      </div>

      <!-- Le card dei tool vengono create da src/main.js usando src/tools/registry.js -->
      <div class="tool-grid"></div>
    </section>

    <!-- Le aree di lavoro dei tool (src/tools/<tool>/view.html) vengono aggiunte qui quando apri un tool -->
  </main>

  <footer class="site-footer">
    <div class="container">
      PixelTools · nessun upload, nessun tracciamento · i file restano sul tuo dispositivo
    </div>
  </footer>
</body>
</html>
